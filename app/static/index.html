<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PulseChat — Real-Time WebSocket Chat Application</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="brand">
                    <div class="brand-icon">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                        </svg>
                    </div>
                    <span>PulseChat</span>
                </div>
            </div>

            <!-- Current User Profile Bar -->
            <div class="user-profile-bar">
                <div class="user-info">
                    <div class="avatar" id="current-user-avatar" style="background-color: #6366f1;">
                        U
                        <div class="status-dot online"></div>
                    </div>
                    <div class="user-details">
                        <span class="user-name" id="current-user-name">Guest</span>
                        <span class="user-subtext" id="current-user-status">Connecting...</span>
                    </div>
                </div>
                <button class="action-btn" id="logout-btn" title="Sign Out">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                        <polyline points="16 17 21 12 16 7"></polyline>
                        <line x1="21" y1="12" x2="9" y2="12"></line>
                    </svg>
                </button>
            </div>

            <!-- Search Bar -->
            <div class="search-container">
                <div class="search-input-wrapper">
                    <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                    <input type="text" class="search-input" id="search-input" placeholder="Search channels & users...">
                </div>
            </div>

            <!-- Navigation Sections -->
            <div class="sidebar-content">
                <!-- Channels -->
                <div class="section-header">
                    <span>Chat Channels</span>
                    <button class="section-btn" id="add-room-btn" title="Create New Channel">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                            <line x1="12" y1="5" x2="12" y2="19"></line>
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                        </svg>
                    </button>
                </div>
                <ul class="item-list" id="rooms-list">
                    <!-- Populated dynamically via JS -->
                </ul>

                <!-- Direct Messages -->
                <div class="section-header" style="margin-top: 14px;">
                    <span>Direct Messages</span>
                </div>
                <ul class="item-list" id="users-list">
                    <!-- Populated dynamically via JS -->
                </ul>
            </div>
        </aside>

        <!-- Main Chat Area -->
        <main class="chat-area">
            <!-- Chat Header -->
            <header class="chat-header">
                <div class="chat-header-info">
                    <button class="icon-btn mobile-menu-btn" id="mobile-menu-btn" title="Toggle Menu">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="3" y1="12" x2="21" y2="12"></line>
                            <line x1="3" y1="6" x2="21" y2="6"></line>
                            <line x1="3" y1="18" x2="21" y2="18"></line>
                        </svg>
                    </button>
                    <div class="room-title-wrapper">
                        <h2 id="current-channel-title"># General Discussion</h2>
                        <span class="room-description" id="current-channel-desc">Welcome channel for all team members</span>
                    </div>
                </div>

                <div class="chat-header-actions">
                    <div class="badge" id="room-online-count" style="background: rgba(16, 185, 129, 0.15); color: #10b981; border: 1px solid rgba(16, 185, 129, 0.3);">
                        1 Online
                    </div>
                    <button class="icon-btn active" id="sound-toggle-btn" title="Toggle Message Audio Chime">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                            <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                        </svg>
                    </button>
                </div>
            </header>

            <!-- Message Feed -->
            <div class="messages-container" id="messages-container">
                <!-- Messages populated via JS -->
            </div>

            <!-- Typing Indicator Bar -->
            <div class="typing-bar" id="typing-bar" style="display: none;">
                <div class="typing-dots">
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                </div>
                <span id="typing-text">Someone is typing...</span>
            </div>

            <!-- Chat Input Area -->
            <div class="chat-input-container">
                <!-- File Pending Preview -->
                <div class="file-preview-strip" id="file-preview-strip" style="display: none;">
                    <div class="preview-left">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>
                        <span id="preview-file-name">file.png</span>
                    </div>
                    <button class="action-btn" id="clear-file-btn" title="Remove attachment">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                    </button>
                </div>

                <!-- Input Box -->
                <div class="input-box">
                    <input type="file" id="file-input" style="display: none;">
                    <button class="action-btn" id="attach-btn" title="Attach file or media">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path>
                        </svg>
                    </button>

                    <textarea class="chat-textarea" id="chat-input" placeholder="Type a message... (Press Enter to send, Shift+Enter for newline)" rows="1"></textarea>

                    <button class="action-btn" id="emoji-btn" title="Pick emoji">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10"></circle>
                            <path d="M8 14s1.5 2 4 2 4-2 4-2"></path>
                            <line x1="9" y1="9" x2="9.01" y2="9"></line>
                            <line x1="15" y1="9" x2="15.01" y2="9"></line>
                        </svg>
                    </button>

                    <button class="send-btn" id="send-btn" title="Send message">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="22" y1="2" x2="11" y2="13"></line>
                            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Emoji Picker Tray -->
            <div class="emoji-tray" id="emoji-tray" style="display: none;">
                <button class="emoji-item">😀</button>
                <button class="emoji-item">😂</button>
                <button class="emoji-item">😍</button>
                <button class="emoji-item">🔥</button>
                <button class="emoji-item">👍</button>
                <button class="emoji-item">🎉</button>
                <button class="emoji-item">🚀</button>
                <button class="emoji-item">💻</button>
                <button class="emoji-item">❤️</button>
                <button class="emoji-item">🙌</button>
                <button class="emoji-item">✨</button>
                <button class="emoji-item">👏</button>
            </div>
        </main>
    </div>

    <!-- Auth Modal (Login / Register) -->
    <div class="modal-overlay" id="auth-modal">
        <div class="modal-card">
            <div class="modal-header">
                <div class="brand">
                    <div class="brand-icon">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                    </div>
                    <span>PulseChat</span>
                </div>
            </div>

            <div class="auth-tabs">
                <div class="auth-tab active" id="tab-login">Sign In</div>
                <div class="auth-tab" id="tab-register">Create Account</div>
            </div>

            <div id="auth-error" style="color: var(--danger); font-size: 0.85rem; margin-bottom: 12px; min-height: 18px;"></div>

            <!-- Login Form -->
            <form id="login-form">
                <div class="form-group">
                    <label class="form-label">Username</label>
                    <input type="text" class="form-input" id="login-username" required placeholder="e.g. alice">
                </div>
                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" class="form-input" id="login-password" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn-primary">Sign In</button>
            </form>

            <!-- Register Form -->
            <form id="register-form" style="display: none;">
                <div class="form-group">
                    <label class="form-label">Username</label>
                    <input type="text" class="form-input" id="reg-username" required placeholder="e.g. johndoe">
                </div>
                <div class="form-group">
                    <label class="form-label">Display Name</label>
                    <input type="text" class="form-input" id="reg-name" required placeholder="e.g. John Doe">
                </div>
                <div class="form-group">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-input" id="reg-email" required placeholder="john@example.com">
                </div>
                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" class="form-input" id="reg-password" required placeholder="Min 6 characters">
                </div>
                <div class="form-group">
                    <label class="form-label">Bio (Optional)</label>
                    <input type="text" class="form-input" id="reg-bio" placeholder="Software Engineer / Student">
                </div>
                <div class="form-group">
                    <label class="form-label">Choose Avatar Color</label>
                    <div class="color-picker-row">
                        <div class="color-swatch active" data-color="#6366f1" style="background: #6366f1;"></div>
                        <div class="color-swatch" data-color="#ec4899" style="background: #ec4899;"></div>
                        <div class="color-swatch" data-color="#10b981" style="background: #10b981;"></div>
                        <div class="color-swatch" data-color="#3b82f6" style="background: #3b82f6;"></div>
                        <div class="color-swatch" data-color="#f59e0b" style="background: #f59e0b;"></div>
                        <div class="color-swatch" data-color="#8b5cf6" style="background: #8b5cf6;"></div>
                    </div>
                </div>
                <button type="submit" class="btn-primary">Create Account</button>
            </form>

            <!-- Quick Demo Login Helpers -->
            <div class="quick-demo-section">
                <span style="font-size: 0.78rem; color: var(--text-muted);">Quick Evaluator Demo Logins:</span>
                <div class="demo-btn-group">
                    <button class="demo-btn" id="demo-alice-btn">👤 Login as Alice</button>
                    <button class="demo-btn" id="demo-bob-btn">👤 Login as Bob</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Create Room Modal -->
    <div class="modal-overlay" id="create-room-modal">
        <div class="modal-card">
            <div class="modal-header">
                <h3 class="modal-title">Create New Channel</h3>
                <button class="action-btn" id="close-room-modal">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            </div>
            <form id="create-room-form">
                <div class="form-group">
                    <label class="form-label">Channel Name</label>
                    <input type="text" class="form-input" id="new-room-name" required placeholder="e.g. hackathon-team">
                </div>
                <div class="form-group">
                    <label class="form-label">Topic / Description</label>
                    <input type="text" class="form-input" id="new-room-desc" placeholder="What is this channel about?">
                </div>
                <button type="submit" class="btn-primary">Create Channel</button>
            </form>
        </div>
    </div>

    <!-- Lightbox Modal for Images -->
    <div class="lightbox-modal" id="lightbox-modal">
        <img src="" class="lightbox-img" id="lightbox-img" alt="Enlarged media preview">
    </div>

    <script src="/static/js/app.js"></script>
</body>
</html>
